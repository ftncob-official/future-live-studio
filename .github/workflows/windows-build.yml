
name: Future Live Studio - Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360

    steps:
      - name: Checkout OBS Studio with full Git history
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Install missing ATL components
        shell: powershell
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath

          Write-Host "Visual Studio Path: $vsPath"

          if (-not $vsPath) {
            throw "Visual Studio installation was not found."
          }

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          $arguments = @(
            "modify"
            "--installPath", "$vsPath"
            "--add", "Microsoft.VisualStudio.Component.VC.ATL"
            "--quiet"
            "--norestart"
            "--nocache"
          )

          Start-Process -FilePath $installer -ArgumentList $arguments -Wait

          Write-Host "ATL installation process completed."

      - name: Configure OBS
        run: cmake --preset windows-x64

      - name: Build OBS
        run: cmake --build --preset windows-x64 --config Release --parallel

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Future-Live-Studio-Windows-Build
          path: build_x64/rundir/Release/
          if-no-files-found: warn
          retention-days: 7

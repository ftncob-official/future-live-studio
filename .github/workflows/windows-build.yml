
name: Future Live Studio Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout OBS Studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Patch OBS Sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Remove Windows DirectShow module registration
          $pluginsFile = "plugins/CMakeLists.txt"
          $pluginsText = Get-Content $pluginsFile -Raw

          $pluginsText = $pluginsText -replace '(?m)^\s*add_core_module\(win-dshow PLATFORMS WINDOWS\)\s*\r?\n', ''

          Set-Content $pluginsFile $pluginsText -Encoding utf8

          # Remove Windows captions source entries
          $frontendCMake = "plugins/frontend-tools/CMakeLists.txt"
          $frontendText = Get-Content $frontendCMake -Raw

          $frontendText = $frontendText -replace '(?m)^\s*\$<\$<PLATFORM_ID:Windows>:captions[^>]*>\s*\r?\n', ''

          Set-Content $frontendCMake $frontendText -Encoding utf8

          # Remove captions declarations and calls
          $frontendC = "plugins/frontend-tools/frontend-tools.c"
          $frontendCText = Get-Content $frontendC -Raw

          $frontendCText = $frontendCText -replace '(?s)#if defined\(_WIN32\)\s*void InitCaptions\(\);\s*void FreeCaptions\(\);\s*#endif\s*', ''

          $frontendCText = $frontendCText -replace '(?s)#if defined\(_WIN32\)\s*InitCaptions\(\);\s*#endif\s*', ''

          $frontendCText = $frontendCText -replace '(?s)#if defined\(_WIN32\)\s*FreeCaptions\(\);\s*#endif\s*', ''

          Set-Content $frontendC $frontendCText -Encoding utf8

          Write-Host "Patch completed."

      - name: Configure OBS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --preset windows-x64 `
            -DOBS_VERSION_OVERRIDE=32.0.0 `
            -DENABLE_VIRTUALCAM=OFF `
            -DENABLE_QSV11=OFF

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build OBS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build --preset windows-x64 --config Release --parallel 4

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Future-Live-Studio-Windows
          path: build_x64/rundir/Release/
          if-no-files-found: error
          compression-level: 6

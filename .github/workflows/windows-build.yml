
name: Future Live Studio - Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout OBS Studio with full Git history
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Configure OBS
        run: cmake --preset windows-x64

      - name: Build OBS
        run: cmake --build --preset windows-x64 --config Release --parallel

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Future-Live-Studio-Windows-Build
          path: build_x64/rundir/Release/
          if-no-files-found: warn
          retention-days: 7


name: Future Live Studio - Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360

    steps:
      - name: Checkout OBS Studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Disable ATL-dependent features
        shell: powershell
        run: |
          Write-Host "Disabling Virtual Camera and QSV11..."

          # Patch frontend-tools to remove Windows captions source files
          $file = "plugins/frontend-tools/CMakeLists.txt"

          if (Test-Path $file) {
            $content = Get-Content $file -Raw

            $content = $content -replace `
              '\$<\$<PLATFORM_ID:Windows>:captions-handler\.cpp>\s*', ''

            $content = $content -replace `
              '\$<\$<PLATFORM_ID:Windows>:captions-handler\.hpp>\s*', ''

            $content = $content -replace `
              '\$<\$<PLATFORM_ID:Windows>:captions-mssapi-stream\.cpp>\s*', ''

            $content = $content -replace `
              '\$<\$<PLATFORM_ID:Windows>:captions-mssapi-stream\.hpp>\s*', ''

            $content = $content -replace `
              '\$<\$<PLATFORM_ID:Windows>:captions-mssapi\.cpp>\s*', ''

            $content = $content -replace `
              '\$<\$<PLATFORM_ID:Windows>:captions-mssapi\.hpp>\s*', ''

            $content = $content -replace `
              '\$<\$<PLATFORM_ID:Windows>:captions\.cpp>\s*', ''

            $content = $content -replace `
              '\$<\$<PLATFORM_ID:Windows>:captions\.hpp>\s*', ''

            Set-Content $file $content -Encoding UTF8
            Write-Host "Captions sources patched."
          }

      - name: Configure OBS
        shell: powershell
        run: |
          cmake --preset windows-x64 `
            -DENABLE_VIRTUALCAM=OFF `
            -DENABLE_QSV11=OFF

      - name: Build OBS
        shell: powershell
        run: cmake --build --preset windows-x64 --config Release --parallel 4

      - name: Upload Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Future-Live-Studio-Windows-Build
          path: build_x64/rundir/Release/
          if-no-files-found: error
          retention-days: 7

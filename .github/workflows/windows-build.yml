
name: Future Live Studio - Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360

    steps:
      - name: Checkout OBS Studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Locate Visual Studio
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere -latest -products * -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio not found"
          }

          "VS_PATH=$vsPath" | Out-File $env:GITHUB_ENV -Append
          Write-Host "VS Path: $vsPath"

      - name: Install ATL
        shell: powershell
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          if (-not (Test-Path $installer)) {
            throw "VS Installer not found: $installer"
          }

          $arguments = @(
            "modify"
            "--installPath"
            "`"$env:VS_PATH`""
            "--add"
            "Microsoft.VisualStudio.Component.VC.ATL"
            "--quiet"
            "--norestart"
          )

          Write-Host "Starting ATL installation..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            Write-Host "Installer returned non-zero exit code."
          }

      - name: Verify ATL
        shell: powershell
        run: |
          $atlDir = Join-Path $env:VS_PATH "VC\Tools\MSVC"

          $required = @(
            "atlbase.h",
            "atlcomcli.h",
            "atlstr.h"
          )

          foreach ($header in $required) {
            $file = Get-ChildItem `
              -Path $atlDir `
              -Filter $header `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($file) {
              Write-Host "FOUND: $($file.FullName)"
            } else {
              Write-Host "MISSING: $header"
              throw "ATL installation incomplete"
            }
          }

          Write-Host "ATL verified successfully!"

      - name: Configure OBS
        shell: powershell
        run: cmake --preset windows-x64

      - name: Build OBS
        shell: powershell
        run: cmake --build --preset windows-x64 --config Release --parallel 4

      - name: Upload Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Future-Live-Studio-Windows-Build
          path: build_x64/rundir/Release/
          if-no-files-found: error
          retention-days: 7

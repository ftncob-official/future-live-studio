
name: Future Live Studio - Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360

    steps:
      - name: Checkout OBS Studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Check Visual Studio and ATL
        shell: powershell
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath

          Write-Host "VS Path: $vsPath"

          if (-not $vsPath) {
            throw "Visual Studio not found."
          }

          $atlDir = Join-Path $vsPath "VC\Tools\MSVC"

          $headers = @(
            "atlbase.h",
            "atlcomcli.h",
            "atlstr.h"
          )

          foreach ($header in $headers) {
            $result = Get-ChildItem -Path $atlDir -Filter $header -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1

            if (-not $result) {
              Write-Host "MISSING: $header"
              throw "ATL header missing: $header"
            }

            Write-Host "FOUND: $header"
            Write-Host $result.FullName
          }

      - name: Configure OBS
        run: cmake --preset windows-x64

      - name: Build OBS
        run: cmake --build --preset windows-x64 --config Release --parallel

      - name: Upload OBS build
        uses: actions/upload-artifact@v4
        with:
          name: Future-Live-Studio-Windows-Build
          path: build_x64/rundir/Release/
          if-no-files-found: warn
          retention-days: 7

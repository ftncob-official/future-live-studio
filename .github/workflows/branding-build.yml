
name: Future Live Studio Branding Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout OBS Studio Source
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          submodules: recursive
          fetch-depth: 0

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v2

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure OBS
        shell: pwsh
        run: |
          cmake --preset windows-x64

      - name: Build OBS
        shell: pwsh
        run: |
          cmake --build --preset windows-x64 --config RelWithDebInfo --parallel

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: Future-Live-Studio-1.0.0
          path: |
            build_x64/rundir/RelWithDebInfo
            build/rundir/RelWithDebInfo
            build_x64/rundir/Release
            build/rundir/Release
          if-no-files-found: warn
          compression-level: 6
